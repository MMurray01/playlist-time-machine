name: Repair App Store screenshots

# Lists version 1.0 screenshots, deletes failed or wrong-size files, and uploads
# the captured 6.9-inch and 13-inch sets to the display types Apple accepts.
# Does not submit for review and does not upload a TestFlight build.

on:
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  repair:
    name: Repair screenshots
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Require App Store Connect secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "${ASC_ISSUER_ID}" ] && missing+=(ASC_ISSUER_ID)
          [ -z "${ASC_KEY_ID}" ] && missing+=(ASC_KEY_ID)
          [ -z "${ASC_PRIVATE_KEY}" ] && missing+=(ASC_PRIVATE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Missing App Store Connect secrets::${missing[*]}"
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Download the captured screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 38950723496 --name app-store-screenshots --dir "${RUNNER_TEMP}/shots"
          find "${RUNNER_TEMP}/shots" -name '*.png' -printf '%p\n' | sort

      - name: Repair version 1.0 screenshots
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_SCREENSHOT_DIR: ${{ runner.temp }}/shots
          ASC_RESULT_PATH: ${{ runner.temp }}/screenshot-repair.json
        run: python3 -u .github/scripts/repair_screenshots.py

      - name: Upload the repair report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-repair-report
          path: ${{ runner.temp }}/screenshot-repair.json
          if-no-files-found: warn
