name: TestFlight

# Uploads an App Store archive for cursor/ios-app-v1-d049.
# Repository secrets, all required:
#   ASC_ISSUER_ID    App Store Connect API issuer ID
#   ASC_KEY_ID       App Store Connect API key ID
#   ASC_PRIVATE_KEY  Contents of the AuthKey .p8 file
# The build number is the GitHub Actions run number.

on:
  push:
    branches:
      - cursor/ios-app-v1-d049
  workflow_dispatch:

concurrency:
  group: testflight-cursor-ios-app-v1-d049
  cancel-in-progress: true

jobs:
  upload:
    name: Upload to TestFlight
    runs-on: macos-15
    steps:
      - name: Require App Store Connect secrets
        id: secrets
        env:
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
        run: |
          missing=()
          [ -z "${ASC_ISSUER_ID}" ] && missing+=(ASC_ISSUER_ID)
          [ -z "${ASC_KEY_ID}" ] && missing+=(ASC_KEY_ID)
          [ -z "${ASC_PRIVATE_KEY}" ] && missing+=(ASC_PRIVATE_KEY)
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "present=false" >> "${GITHUB_OUTPUT}"
            echo "::notice title=TestFlight upload skipped::Missing repository secrets: ${missing[*]}. Add ASC_ISSUER_ID, ASC_KEY_ID, and ASC_PRIVATE_KEY (the .p8 file contents), then rerun this workflow."
            exit 0
          fi
          echo "present=true" >> "${GITHUB_OUTPUT}"

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.present == 'true'

      - name: Install XcodeGen
        if: steps.secrets.outputs.present == 'true'
        run: brew install xcodegen

      - name: Generate the Xcode project
        if: steps.secrets.outputs.present == 'true'
        working-directory: ios
        run: xcodegen generate

      - name: Write the App Store Connect API key
        if: steps.secrets.outputs.present == 'true'
        env:
          ASC_PRIVATE_KEY: ${{ secrets.ASC_PRIVATE_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set +x
          umask 077
          python3 - << 'PY'
          import os
          import pathlib
          import re
          import subprocess

          key_id = "".join(os.environ["ASC_KEY_ID"].split())
          issuer = "".join(os.environ["ASC_ISSUER_ID"].split())
          text = (
              os.environ["ASC_PRIVATE_KEY"]
              .replace("\\n", "\n")
              .replace("\r\n", "\n")
              .replace("\r", "\n")
              .strip()
              .strip('"')
              .strip("'")
          )
          match = re.search(
              r"-----BEGIN ([A-Z0-9 ]*)PRIVATE KEY-----(.*?)-----END \1PRIVATE KEY-----",
              text,
              re.S,
          )
          if not match:
              raise SystemExit(
                  "ASC_PRIVATE_KEY is not a PEM private key. Paste the .p8 file contents, including the BEGIN and END lines."
              )
          body = re.sub(r"\s+", "", match.group(2))
          if not re.fullmatch(r"[A-Za-z0-9+/=]+", body):
              raise SystemExit("ASC_PRIVATE_KEY is not valid base64. Paste the .p8 file again.")
          wrapped = "\n".join(body[i : i + 64] for i in range(0, len(body), 64))
          label = match.group(1)
          pem = f"-----BEGIN {label}PRIVATE KEY-----\n{wrapped}\n-----END {label}PRIVATE KEY-----\n"

          print(f"ASC_ISSUER_ID length {len(issuer)}")
          print(f"ASC_KEY_ID length {len(key_id)}")
          if not re.fullmatch(
              r"[0-9a-fA-F]{8}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{4}-[0-9a-fA-F]{12}",
              issuer,
          ):
              raise SystemExit(
                  "ASC_ISSUER_ID is not the Issuer ID UUID from App Store Connect "
                  "(Users and Access, Integrations, Team Keys). The Team ID WS2R3SYV4W is a different value. "
                  "Update the ASC_ISSUER_ID secret and rerun."
              )
          if not re.fullmatch(r"[A-Za-z0-9]{10}", key_id):
              raise SystemExit(
                  "ASC_KEY_ID is not a 10-character App Store Connect Key ID. "
                  "Update ASC_KEY_ID to the Key ID of the Admin API key and rerun."
              )

          home = pathlib.Path.home()
          directories = [
              home / "private_keys",
              home / ".private_keys",
              home / ".appstoreconnect" / "private_keys",
              pathlib.Path("private_keys"),
          ]
          primary = home / "private_keys" / f"AuthKey_{key_id}.p8"
          for directory in directories:
              directory.mkdir(mode=0o700, parents=True, exist_ok=True)
              for name in (f"AuthKey_{key_id}.p8", f"ApiKey_{key_id}.p8"):
                  path = directory / name
                  path.write_text(pem)
                  path.chmod(0o600)
          parsed = subprocess.run(
              ["openssl", "pkey", "-in", str(primary), "-noout"],
              capture_output=True,
              text=True,
          )
          if parsed.returncode != 0:
              raise SystemExit(
                  "ASC_PRIVATE_KEY could not be parsed as a private key. "
                  "Paste the .p8 downloaded for this Key ID again."
              )
          with pathlib.Path(os.environ["GITHUB_ENV"]).open("a") as handle:
              handle.write(f"KEY_PATH={primary}\n")
              handle.write(f"ASC_KEY_ID={key_id}\n")
              handle.write(f"ASC_ISSUER_ID={issuer}\n")
              handle.write(f"API_PRIVATE_KEYS_DIR={primary.parent}\n")
          print("Wrote the API key for altool and Xcode.")
          PY

      - name: Verify the App Store Connect API key
        if: steps.secrets.outputs.present == 'true'
        run: python3 .github/scripts/asc_upload.py --check

      - name: Archive for App Store Connect
        if: steps.secrets.outputs.present == 'true'
        working-directory: ios
        run: |
          echo "Build number: ${{ github.run_number }}"
          # Automatic signing needs one registered device before it can create
          # a development profile. Retry briefly while that registration lands.
          set +e
          for attempt in 1 2 3 4 5 6 7 8; do
            xcodebuild \
              -project PlaylistTimeMachine.xcodeproj \
              -scheme PlaylistTimeMachine \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath "${RUNNER_TEMP}/PlaylistTimeMachine.xcarchive" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "${KEY_PATH}" \
              -authenticationKeyID "${ASC_KEY_ID}" \
              -authenticationKeyIssuerID "${ASC_ISSUER_ID}" \
              CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
              DEVELOPMENT_TEAM=WS2R3SYV4W \
              CODE_SIGN_STYLE=Automatic \
              archive > "${RUNNER_TEMP}/archive.log" 2>&1
            status=$?
            cat "${RUNNER_TEMP}/archive.log"
            if [ "${status}" -eq 0 ]; then
              exit 0
            fi
            if grep -q "no devices" "${RUNNER_TEMP}/archive.log" && [ "${attempt}" -lt 8 ]; then
              echo "No registered device yet (attempt ${attempt}). Waiting for the iPhone registration."
              sleep 45
              continue
            fi
            exit "${status}"
          done

      - name: Export and upload to App Store Connect
        if: steps.secrets.outputs.present == 'true'
        run: |
          cat > "${RUNNER_TEMP}/ExportOptions.plist" << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
          	<key>destination</key>
          	<string>export</string>
          	<key>manageAppVersionAndBuildNumber</key>
          	<false/>
          	<key>method</key>
          	<string>app-store-connect</string>
          	<key>signingStyle</key>
          	<string>automatic</string>
          	<key>teamID</key>
          	<string>WS2R3SYV4W</string>
          	<key>uploadSymbols</key>
          	<true/>
          </dict>
          </plist>
          EOF
          xcodebuild \
            -exportArchive \
            -archivePath "${RUNNER_TEMP}/PlaylistTimeMachine.xcarchive" \
            -exportPath "${RUNNER_TEMP}/export" \
            -exportOptionsPlist "${RUNNER_TEMP}/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "${KEY_PATH}" \
            -authenticationKeyID "${ASC_KEY_ID}" \
            -authenticationKeyIssuerID "${ASC_ISSUER_ID}"
          ipa="$(find "${RUNNER_TEMP}/export" -name '*.ipa' -print -quit)"
          if [ -z "${ipa}" ]; then
            echo "Export did not produce an ipa."
            exit 1
          fi
          sign_tmp="$(mktemp -d)"
          unzip -q "${ipa}" -d "${sign_tmp}"
          app="$(find "${sign_tmp}/Payload" -maxdepth 1 -name '*.app' -print -quit)"
          codesign -dv --verbose=4 "${app}" > "${RUNNER_TEMP}/codesign.txt" 2>&1
          echo "Codesign identity:"
          grep -E "Authority=|Identifier=|TeamIdentifier=" "${RUNNER_TEMP}/codesign.txt"
          if ! grep -q "Authority=Apple Distribution" "${RUNNER_TEMP}/codesign.txt"; then
            echo "The IPA is not signed with an Apple Distribution certificate, so it cannot be uploaded."
            exit 1
          fi
          # altool rejects this key's JWT. The build upload API accepts the same key.
          python3 .github/scripts/asc_upload.py "${ipa}"
          {
            echo "### TestFlight"
            echo "Uploaded build ${{ github.run_number }} (version 1.0) to App Store Connect."
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Remove the API key file
        if: always() && steps.secrets.outputs.present == 'true'
        run: |
          rm -f \
            "${KEY_PATH}" \
            "${HOME}/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/private_keys/ApiKey_${ASC_KEY_ID}.p8" \
            "${HOME}/.private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/.private_keys/ApiKey_${ASC_KEY_ID}.p8" \
            "${HOME}/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "${HOME}/.appstoreconnect/private_keys/ApiKey_${ASC_KEY_ID}.p8" \
            "private_keys/AuthKey_${ASC_KEY_ID}.p8" \
            "private_keys/ApiKey_${ASC_KEY_ID}.p8"
